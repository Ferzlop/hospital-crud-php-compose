services:
  hosp-web:
    build: .
    ports:
      - "8082:80"
    depends_on:
      - hosp-db
    networks:
      - red-web
      - red-db

  hosp-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: hospital123
      POSTGRES_DB: hospital_anomalias
    volumes:
      - db_data:/var/lib/postgresql/data
      # Este archivo se ejecuta SOLO la primera vez que el volumen está
      # vacío: crea la tabla "pacientes" y mete los 2 registros de ejemplo.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      # hosp-db SOLO pertenece a red-db -> nunca ve nada de red-web.
      - red-db

volumes:
  db_data:

networks:
  red-web:
  red-db:
